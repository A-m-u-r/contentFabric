services:
  backend:
    build: .
    container_name: openshorts-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    # Резолвер Docker (127.0.0.11) на Windows разрешает имена через раз: 2026-08-05
    # `fal.run` отвечал, а `queue.fal.run` — куда уходит каждая генерация — не
    # разрешался ни разу из четырёх. Наружу это выглядело как отказ модели, и
    # редакторы вычёркивались как зарубленные модерацией. Спрашиваем напрямую.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  frontend:
    build: ./dashboard
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    environment:
      - VITE_HMR_CLIENT_PORT=5175
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
