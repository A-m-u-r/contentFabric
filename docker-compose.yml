services:
  backend:
    build: .
    container_name: openshorts-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    # Резолвер Docker (127.0.0.11) на Windows разрешает имена через раз: 2026-08-05
    # `fal.run` отвечал, а `queue.fal.run` — куда уходит каждая генерация — не
    # разрешался ни разу из четырёх. Наружу это выглядело как отказ модели, и
    # редакторы вычёркивались как зарубленные модерацией. Спрашиваем напрямую.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Одного выбора апстрима мало. У хостов fal нет AAAA-записи, а glibc шлёт A и
    # AAAA параллельно в один сокет: под нагрузкой (три потока опрашивают очередь
    # каждые 5 секунд плюс заливки) ответ «AAAA нет» возвращается как ответ на всё
    # обращение — снаружи это `[Errno -5] No address associated with hostname`.
    # 2026-08-05 так потерялись три уже оплаченных клипа Kling: fal их досчитал,
    # а скачать результат не вышло. `single-request-reopen` разводит два запроса
    # по очереди, остальное — не сдаваться с первой потери пакета.
    dns_opt:
      - single-request-reopen
      - timeout:2
      - attempts:5
    restart: unless-stopped

  frontend:
    build: ./dashboard
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    environment:
      - VITE_HMR_CLIENT_PORT=5175
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
