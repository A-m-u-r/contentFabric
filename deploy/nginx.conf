server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # FastAPI accepts videos up to 2 GB. Allow time for uploads and CPU work.
    client_max_body_size 2048m;
    client_body_timeout 300s;
    proxy_connect_timeout 15s;
    proxy_read_timeout 1200s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolve recreated Compose services again after each image update.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $renderer http://renderer:3100;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|videos|thumbnails|gallery|video)(/|$) {
        proxy_pass $backend;
        proxy_request_buffering off;
    }

    location ~ ^/render(/|$) {
        proxy_pass $renderer;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
